<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tìm kiếm nhà đất — My Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="search">
  <div id="header"></div>

  <!-- Thanh tìm kiếm -->
  <div class="searchbar-wrap">
    <form class="container searchbar" id="searchBar" autocomplete="off">
      <select id="bMode" class="field"></select>
      <select id="bCity" class="field"></select>
      <div class="search__kw">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="bKeyword" type="text" placeholder="Nhập địa điểm, tên dự án, đường phố..." />
      </div>
      <button class="btn btn--primary btn--lg" type="submit">Tìm kiếm</button>
    </form>
  </div>

  <main class="container page">
    <nav class="crumbs"><a href="index.html">Trang chủ</a> / <span id="crumbCurrent">Nhà đất</span></nav>

    <div class="layout">
      <section>
        <div class="section__head section__head--tight">
          <div>
            <h1 class="page-title" id="resultTitle">Nhà đất</h1>
            <p class="muted" id="resultMeta"></p>
          </div>
          <div class="toolbar">
            <select id="sortSel" class="field field--sm">
              <option value="new">Thông thường</option>
              <option value="priceAsc">Giá thấp → cao</option>
              <option value="priceDesc">Giá cao → thấp</option>
              <option value="areaDesc">Diện tích lớn nhất</option>
              <option value="ppmAsc">Giá/m² thấp nhất</option>
            </select>
            <div class="view-switch">
              <button data-view="list" title="Dạng danh sách">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/></svg>
              </button>
              <button data-view="grid" title="Dạng lưới">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="chips" id="activeChips"></div>
        <div class="cards" id="cards"></div>
        <div class="pagination" id="pagination"></div>
      </section>

      <!-- Bộ lọc nhanh bên phải -->
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
